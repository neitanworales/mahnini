<div class="login-page">
  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h1 class="login-card__title">Iniciar sesión</h1>

    <label class="login-card__field">
      <span>Correo</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="login-card__field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (errorMessage()) {
      <p class="login-card__error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="login-card__submit" [disabled]="loginForm.invalid || loading()">
      {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
